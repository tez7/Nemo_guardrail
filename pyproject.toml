[project]
name = "nemo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.24.0",
    "langchain-openai>=1.7.2",
    "nemoguardrails<0.22",
    "nest-asyncio>=1.5.6",
    "openai>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "rich>=13.0.0",
    "streamlit>=1.32.0",
]

[project.scripts]
nemo = "nemo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
